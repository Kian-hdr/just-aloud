name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      publish:
        description: Publish a GitHub release after signing and notarization
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.publish }}
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Import Developer ID certificate into an ephemeral Keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/just-aloud.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p temporary "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: Build, verify, and sign
        env:
          VERSION: ${{ inputs.version }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          ./scripts/verify.sh
          ./scripts/build.sh
          ./scripts/sign.sh
          ./scripts/package.sh
      - name: Create ephemeral notarytool profile and notarize
        env:
          VERSION: ${{ inputs.version }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ci-profile --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          NOTARY_PROFILE=ci-profile ./scripts/notarize.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" "artifacts/Just-Aloud-$VERSION.zip" "artifacts/Just-Aloud-$VERSION.zip.sha256" --title "Just Aloud v$VERSION" --generate-notes
